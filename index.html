<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/sss.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>SSS Risk Management & Insurance Brokers Pvt Ltd</title>
    <meta name="description" content="SSS Risk Management — IRDAI Certified Direct Broker for Life & General Insurance. Motor, Health, Life, Home, Travel & Commercial Insurance. 25,000+ happy customers." />
    <meta name="keywords" content="insurance broker, IRDAI broker, motor insurance, health insurance, life insurance, SSS Risk Management, Ahmedabad insurance broker" />
    <meta name="author" content="SSS Risk Management & Insurance Brokers Pvt Ltd" />
    <link rel="canonical" href="https://sssinsurance.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sssinsurance.in/" />
    <meta property="og:title" content="SSS Risk Management & Insurance Brokers Pvt Ltd" />
    <meta property="og:description" content="IRDAI Certified Direct Broker for Life & General Insurance. Trusted by 25,000+ customers across India." />
    <meta property="og:image" content="https://sssinsurance.in/assets/sss.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="SSS Risk Management & Insurance Brokers" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SSS Risk Management & Insurance Brokers Pvt Ltd" />
    <meta name="twitter:description" content="IRDAI Certified Direct Broker for Life & General Insurance. Trusted by 25,000+ customers." />
    <meta name="twitter:image" content="https://sssinsurance.in/assets/sss.png" />

    <!-- Fonts: Inter + Poppins via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Global base styles -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 15px;
        line-height: 1.6;
        color: #111827;
        background: #fff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        line-height: 1.25;
        color: #111827;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button, input, select, textarea {
        font-family: 'Inter', sans-serif;
        font-size: inherit;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #FF6B00;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #e55f00;
      }

      /* Selection color */
      ::selection {
        background: #FF6B00;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
